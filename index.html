<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Álgebra Lineal - UDI</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .container { 
            text-align: center; 
            padding: 20px;
        }

        /* Estilos del Logo */
        .logo-udi {
            max-width: 350px; /* Tamaño controlado */
            height: auto;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 { 
            color: #003366; /* Azul oscuro institucional */
            margin-bottom: 40px; 
            font-size: 2.2rem; 
            font-weight: 700;
        }
        
        .menu-grid { 
            display: flex; 
            gap: 40px; 
            justify-content: center; 
            flex-wrap: wrap; 
        }
        
        .card {
            background: white;
            width: 260px;
            height: 220px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* Sombra suave y moderna */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
            position: relative;
            overflow: hidden;
        }

        .card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            border-color: #003366; 
        }
        
        .card h2 { 
            margin: 0; 
            font-size: 1.4rem; 
            color: #003366; 
            font-weight: 700;
            margin-top: 15px;
        }
        
        .card p { 
            color: #666; 
            margin-top: 10px; 
            font-size: 0.95rem;
        }
        
        .icon { 
            font-size: 50px; 
            margin-bottom: 10px; 
        }

        /* Barra decorativa inferior en las tarjetas */
        .card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: #003366;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        .card:hover::after {
            transform: scaleX(1);
        }

        footer {
            margin-top: 60px;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://aplicativos.udi.edu.co/proacudi/img/logo-udi.png" alt="Logo UDI" class="logo-udi">
        
        <h1>Calculadora de Álgebra Lineal</h1>
        
        <div class="menu-grid">
            <a href="grafico.html" class="card">
                <div class="icon">📈</div>
                <h2>Método Gráfico</h2>
                <p>Solución visual para 2 variables</p>
            </a>

            <a href="simplex.html" class="card">
                <div class="icon">🔢</div>
                <h2>Método Simplex</h2>
                <p>Solución paso a paso para n variables</p>
            </a>
        </div>
        
        <footer>
            Proyecto Universitario - Optimización y Álgebra Lineal &copy; 2024
        </footer>
    </div>

</body>
</html>
